{% set version = environ['OPENXPS_VERSION'][1:] %}

package:
  name: openxps
  version: {{ version }}

source:
  git_url: ../../../

build:
  noarch: python
  number: 0
  script: python -m pip install --no-deps --ignore-installed .

requirements:
  host:
    - python
    - setuptools
    - versioningit
    - pip
  run:
    - python >=3.10
    - numpy
    - openmm >=8.4
    - cvpack
    - pyyaml
    - typing-extensions
  run_constrained:
    # Optional, for ForceMatchingRegressor
    - pytorch
    - lightning
    - pandas

test:
  imports:
    - openxps

about:
  home: https://github.com/craabreu/openxps
  summary: Extended Phase-Space Simulations with OpenMM
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  doc_url: https://craabreu.github.io/openxps/latest
  dev_url: https://github.com/craabreu/openxps

extra:
  recipe-maintainers:
    - craabreu
